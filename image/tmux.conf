# System-wide tmux config. Your own ~/.tmux.conf is read after this one.
# Refresh the API key on attach for newly created panes, without saving it.
set -ag update-environment ' OPENAI_API_KEY'
set -g @continuum-restore 'on'
run-shell /opt/tmux-plugins/tmux-resurrect/resurrect.tmux
run-shell /opt/tmux-plugins/tmux-continuum/continuum.tmux
